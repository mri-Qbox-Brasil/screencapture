name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Build and Create Tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Install archive tools
        run: sudo apt install zip

      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.11.0

      - name: Setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@screencapture'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Set npm package versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');

          for (const file of ['packages/gameview/package.json', 'packages/live/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = process.env.PACKAGE_VERSION;
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE

      - name: Run build
        run: pnpm build
        env:
          CI: false

      - name: Bump manifest version
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Push manifest change
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: fxmanifest.lua
          push: true
          author_name: Manifest Bumper
          message: 'chore: bump manifest version to ${{ github.ref_name }}'

      - name: Update tag ref
        uses: EndBug/latest-tag@v1.6.3
        with:
          ref: ${{ github.ref_name }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/screencapture
          mkdir -p ./temp/screencapture/game
          mkdir -p ./temp/screencapture/game/nui
          cp ./{README.md,LICENSE,fxmanifest.lua} ./temp/screencapture
          cp -r ./game/dist ./temp/screencapture/game/dist
          cp ./game/client.lua ./temp/screencapture/game/client.lua
          cp -r ./game/nui/dist ./temp/screencapture/game/nui/dist
          cd ./temp && zip -r ../screencapture.zip ./screencapture

      - name: Create Release
        run: gh release create "$GITHUB_REF_NAME" screencapture.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
